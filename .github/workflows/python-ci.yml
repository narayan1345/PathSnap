name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pandas scipy scikit-learn pyproj joblib fastapi httpx
      - name: Compile project code
        run: python -m compileall -q src scripts tests api
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
